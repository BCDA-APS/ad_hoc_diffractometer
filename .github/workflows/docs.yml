name: Publish Sphinx Docs to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy documentation'
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  docs:
    name: Build and publish documentation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so hatch-vcs can read git tags

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install package with doc dependencies
        run: pip install -e .[doc]

      - name: Determine DOC_VERSION
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="latest"
          fi
          echo "DOC_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Publishing docs as: ${VERSION}"

      - name: Build Sphinx documentation
        # Note: -W (warnings-as-errors) is intentionally omitted here.
        # Pre-existing docstring formatting issues produce AutoAPI warnings
        # that are tracked separately and will be fixed in Phase 2 content work.
        run: |
          python3 -m sphinx -b html docs/source docs/build/html

      - name: Upload docs as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-${{ env.DOC_VERSION }}
          path: docs/build/html

      - name: Deploy to gh-pages — latest/ (main push)
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/build/html
          destination_dir: latest
          keep_files: true

      - name: Deploy gh-pages root redirect (main push)
        # Publish docs/gh-pages-root/* to the root of the gh-pages branch
        # so that https://bcda-aps.github.io/ad_hoc_diffractometer/ redirects
        # to .../latest/.  keep_files: true preserves all version directories.
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/gh-pages-root
          destination_dir: .
          keep_files: true

      - name: Deploy to gh-pages — <version>/ (tag push)
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/build/html
          destination_dir: ${{ env.DOC_VERSION }}
          keep_files: true

      # ------------------------------------------------------------------
      # After any deploy that wrote to gh-pages, regenerate switcher.json
      # from the *actual* gh-pages directory listing (issue #273).  This
      # replaces the previous "incrementally edit one file" approach,
      # which silently fell behind every time a tag-push update step
      # failed.  The regenerator writes the same canonical JSON into
      # latest/_static/ AND into every vX.Y.Z/_static/ so visitors on an
      # older version page see the same up-to-date dropdown.
      # ------------------------------------------------------------------

      - name: Clone gh-pages for switcher regeneration
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        run: |
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages-clone

      - name: Regenerate switcher.json from gh-pages listing
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        run: |
          python3 tools/regenerate_switcher.py gh-pages-clone

      - name: Remove pre-release doc directories from gh-pages on stable tag
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/') &&
          !contains(env.DOC_VERSION, 'a') &&
          !contains(env.DOC_VERSION, 'b') &&
          !contains(env.DOC_VERSION, 'rc')
        run: |
          set -euo pipefail
          VERSION="${DOC_VERSION}"

          # Delete gh-pages/<base>rcN, <base>aN, <base>bN directories if present.
          PRUNED=()
          for dir in gh-pages-clone/${VERSION}{a,b,rc}*/; do
            [ -d "${dir}" ] || continue
            rm -rf "${dir}"
            PRUNED+=("${dir}")
            echo "Removed directory: ${dir}"
          done

          if [[ ${#PRUNED[@]} -eq 0 ]]; then
            echo "No pre-release directories found for ${VERSION}."
          fi

          # Re-run the regenerator so the pruned versions disappear from
          # switcher.json too.
          python3 tools/regenerate_switcher.py gh-pages-clone

      - name: Commit switcher.json (and pruned directories) to gh-pages
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        working-directory: gh-pages-clone
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No switcher.json or pruning changes to commit."
            exit 0
          fi
          git commit -m "ci: regenerate switcher.json from gh-pages listing (${DOC_VERSION})"
          # Pull with rebase before pushing to avoid "fetch first" rejection
          # when an earlier gh-pages deploy step has just pushed to the branch.
          git pull --rebase origin gh-pages
          git push

      - name: Deploy on manual trigger
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/build/html
          destination_dir: latest
          keep_files: true
