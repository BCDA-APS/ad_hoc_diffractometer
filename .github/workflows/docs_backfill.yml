name: Backfill Docs for a Tagged Version

# Use this workflow to publish docs for a tag that was released before
# versioned docs were introduced.  Run manually from the Actions tab.
#
# Usage:
#   1. Go to Actions -> "Backfill Docs for a Tagged Version"
#   2. Click "Run workflow"
#   3. Enter the tag (e.g. "v0.2.0") in the input field
#   4. Click "Run workflow"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Serialize with the main docs deploy workflow so the two never race
  # on gh-pages writes.
  group: gh-pages-write
  cancel-in-progress: false

jobs:

  backfill:
    name: Backfill docs for tag ${{ github.event.inputs.tag }}
    runs-on: ubuntu-latest

    steps:

      - name: Deploy Information
        run: |
          echo "Building and publishing docs for tag: ${{ github.event.inputs.tag }}"

      - name: Make Temporary Directory
        run: |
          echo "TMP_DIR=$(mktemp -d)" >> "${GITHUB_ENV}"
          echo "DOC_VERSION=${{ github.event.inputs.tag }}" >> "${GITHUB_ENV}"

      - name: Install system dependencies (graphviz)
        run: |
          set -vxeuo pipefail
          sudo apt-get update && sudo apt-get -y install graphviz

      - name: Checkout main (for tools/regenerate_switcher.py)
        uses: actions/checkout@v6
        with:
          path: main-clone

      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and doc requirements
        run: pip install -e .[doc]

      - name: Build docs
        run: |
          HTML_DIR="${TMP_DIR}/build/${DOC_VERSION}"
          echo "HTML_DIR=${HTML_DIR}" >> "${GITHUB_ENV}"
          python3 -m sphinx -b html docs/source "${HTML_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-${{ env.DOC_VERSION }}
          path: ${{ env.HTML_DIR }}

      - name: Deploy to gh-pages/<version>/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ env.HTML_DIR }}
          destination_dir: ${{ env.DOC_VERSION }}
          keep_files: true

      # ------------------------------------------------------------------
      # Regenerate switcher.json from the gh-pages directory listing
      # (issue #273).  Same approach as docs.yml: directory listing is
      # the source of truth; same canonical JSON is mirrored into
      # latest/_static/ and every vX.Y.Z/_static/.
      # ------------------------------------------------------------------

      - name: Clone gh-pages for switcher regeneration
        run: |
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages-clone

      - name: Regenerate switcher.json from gh-pages listing
        run: |
          python3 main-clone/tools/regenerate_switcher.py gh-pages-clone

      - name: Remove pre-release doc directories from gh-pages on stable tag
        if: >-
          !contains(env.DOC_VERSION, 'a') &&
          !contains(env.DOC_VERSION, 'b') &&
          !contains(env.DOC_VERSION, 'rc')
        run: |
          set -euo pipefail
          VERSION="${DOC_VERSION}"

          # Delete gh-pages/<base>rcN, <base>aN, <base>bN directories if present.
          PRUNED=()
          for dir in gh-pages-clone/${VERSION}{a,b,rc}*/; do
            [ -d "${dir}" ] || continue
            rm -rf "${dir}"
            PRUNED+=("${dir}")
            echo "Removed directory: ${dir}"
          done

          if [[ ${#PRUNED[@]} -eq 0 ]]; then
            echo "No pre-release directories found for ${VERSION}."
          fi

          # Re-run the regenerator so the pruned versions disappear from
          # switcher.json too.
          python3 main-clone/tools/regenerate_switcher.py gh-pages-clone

      - name: Commit switcher.json and pruned directories to gh-pages
        working-directory: gh-pages-clone
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No switcher.json or pruning changes to commit."
            exit 0
          fi
          git commit -m "ci: regenerate switcher.json from gh-pages listing (backfill ${DOC_VERSION})"
          git pull --rebase origin gh-pages
          git push
