[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ad_hoc_diffractometer"
dynamic = ["version"]
description = "Describe any multi-circle diffractometer geometry and perform X-ray/neutron crystallography calculations."
authors = [{ name = "Pete Jemian", email = "prjemian+ad_hoc@gmail.com" }]
maintainers = [{ name = "Pete Jemian", email = "prjemian+ad_hoc@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["diffraction", "geometry", "crystallography", "x-ray", "neutron"]
license = "LicenseRef-UChicago-Argonne-LLC-License"
license-files = ["LICEN[CS]E*"]
# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "pyyaml",
]

# Note: the demonstration geometries (fourcv, psic, kappa4cv, ...) are
# declarative YAML files shipped under
# ``src/ad_hoc_diffractometer/geometries/``.  They are auto-registered by
# ``ad_hoc_diffractometer.geometry_loader`` at import time and do **not**
# need to be listed as entry points here.
#
# Third-party packages may still contribute Python-callable factories via
# the ``ad_hoc_diffractometer.geometries`` entry-point group, or
# additional declarative YAML files via run-time
# :func:`ad_hoc_diffractometer.register_geometry_file`.
# See ``docs/source/reference/declarative_geometry_schema.md`` and
# ``docs/source/howto/custom_geometry.md``.

[project.optional-dependencies]
dev = [
    "hatch-vcs",
    "pytest",
    "pytest-cov",
    "scipy",
]
doc = [
    "matplotlib",
    "myst-nb",
    "pydata-sphinx-theme",
    "sphinx",
    "sphinx-autoapi",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-tabs",
]
all = [
    "ad_hoc_diffractometer[dev]",
    "ad_hoc_diffractometer[doc]",
]

[project.urls]
Homepage      = "https://github.com/BCDA-APS/ad_hoc_diffractometer"
Documentation = "https://BCDA-APS.github.io/ad_hoc_diffractometer/latest"
Source        = "https://github.com/BCDA-APS/ad_hoc_diffractometer"
Issues        = "https://github.com/BCDA-APS/ad_hoc_diffractometer/issues"

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
source = ["ad_hoc_diffractometer"]

[tool.hatch.build.hooks.vcs]
version-file = "src/ad_hoc_diffractometer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ad_hoc_diffractometer"]
# Ship the declarative geometry YAML files (and the JSON schema) as
# package data so they can be discovered via ``importlib.resources``.
include = [
    "src/ad_hoc_diffractometer/geometries/*.yml",
    "src/ad_hoc_diffractometer/geometries/*.json",
]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.version]
source = "vcs"
# Require three-component SemVer tags (v0.3.0, v0.4.0, ...);
# this intentionally ignores the legacy two-component tags v0.1 and v0.2.
tag-pattern = "v(?P<version>[0-9]+\\.[0-9]+\\.[0-9].*)"

[tool.isort]
profile = "black"
line_length = 88
force_single_line = true
known_first_party = ["ad_hoc_diffractometer"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
norecursedirs = ["references", "docs", ".git", ".tox", "dist", "build"]
addopts = "--cov=ad_hoc_diffractometer --cov-report=term-missing -m 'not slow_benchmark'"
markers = [
    "slow_benchmark: full benchmark sweep across all geometries (run with: pytest -m slow_benchmark)",
]

[tool.ruff]
line-length = 88
exclude = [
    "references/",       # reference documents, not our source code
    "docs/build/",       # Sphinx build output
    "docs/source/",      # documentation source (reST / Markdown / notebooks)
    "*.ipynb",           # Jupyter notebooks
]

[tool.ruff.format]
# line-length is inherited from [tool.ruff] above

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
# isort is handled by the standalone isort pre-commit hook with
# force_single_line = true; ruff's I rules are intentionally omitted
# to avoid conflicts between the two.
ignore = [
    "E501", # line too long -- tolerate slight overruns beyond 88 chars
]
