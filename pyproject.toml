[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ad_hoc_diffractometer"
dynamic = ["version"]
description = "Multi-circle diffractometer geometry and related calculations"
authors = [{ name = "Pete Jemian", email = "prjemian+chewacla@gmail.com" }]
maintainers = [{ name = "Pete Jemian", email = "prjemian+chewacla@gmail.com" }]
requires-python = ">=3.10"
keywords = ["diffraction", "geometry", "crystallography", "x-ray", "neutron"]
license = "CC-BY-4.0"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "hatch-vcs",
    "pytest",
    "pytest-cov",
]

[project.entry-points."ad_hoc_diffractometer.geometries"]
psic     = "ad_hoc_diffractometer.factories:psic"
fourcv   = "ad_hoc_diffractometer.factories:fourcv"
fourch   = "ad_hoc_diffractometer.factories:fourch"
sixc     = "ad_hoc_diffractometer.factories:sixc"
kappa4cv = "ad_hoc_diffractometer.factories:kappa4cv"
kappa4ch = "ad_hoc_diffractometer.factories:kappa4ch"
kappa6c  = "ad_hoc_diffractometer.factories:kappa6c"
zaxis    = "ad_hoc_diffractometer.factories:zaxis"
s2d2     = "ad_hoc_diffractometer.factories:s2d2"
fivec    = "ad_hoc_diffractometer.factories:fivec"

[tool.hatch.version]
source = "vcs"
# Require three-component SemVer tags (v0.3.0, v0.4.0, ...);
# this intentionally ignores the legacy two-component tags v0.1 and v0.2.
tag-pattern = "v(?P<version>[0-9]+\\.[0-9]+\\.[0-9].*)"

[tool.hatch.build.hooks.vcs]
version-file = "src/ad_hoc_diffractometer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ad_hoc_diffractometer"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.isort]
profile = "black"
line_length = 88
force_single_line = true
known_first_party = ["ad_hoc_diffractometer"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
exclude = [
    "references/",   # reference documents, not our source code
    "docs/",         # documentation
    "*.ipynb",       # Jupyter notebooks
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
# isort is handled by the standalone isort pre-commit hook with
# force_single_line = true; ruff's I rules are intentionally omitted
# to avoid conflicts between the two.
ignore = [
    "E501", # line too long -- tolerate slight overruns beyond 88 chars
]

[tool.ruff.format]
# line-length is inherited from [tool.ruff] above
